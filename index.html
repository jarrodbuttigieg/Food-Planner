<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Family Food Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Food Planner">
<meta name="theme-color" content="#F2F5EC">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234C7A5B'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

  :root{
    --bg:#F2F5EC; --paper:#FFFFFF; --ink:#26332B; --inkSoft:#66766A; --line:#E2E7D9;
    --sage:#4C7A5B; --sageSoft:#E4EEE2;
    --mustard:#DB9F33; --mustardSoft:#FAEDD3;
    --berry:#9C3E5C; --berrySoft:#F5E1E7;
    --teal:#2E7D82; --tealSoft:#DDEEEE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#DDE3D2;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  #shell{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);}
  h1,h2,.serif{font-family:'Fraunces',serif;}
  #view{flex:1;padding-bottom:8px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:14.5px;}
  .px5{padding-left:20px;padding-right:20px;}

  /* header */
  .page-title{font-size:26px;font-weight:700;margin:0;}
  .page-sub{font-size:13.5px;color:var(--inkSoft);margin:4px 0 0;}

  /* pills */
  .pill{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--inkSoft);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  .pill.active{color:#fff;border-color:transparent;}
  .pillrow{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;}
  .pillrow::-webkit-scrollbar{display:none;}

  /* week */
  .weekstrip{display:flex;gap:12px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x proximity;}
  .weekstrip::-webkit-scrollbar{display:none;}
  .daycard{width:200px;flex-shrink:0;scroll-snap-align:start;border-radius:16px;background:#fff;border:1px solid var(--line);overflow:hidden;}
  .daycard-top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0;}
  .daycard-name{font-size:15px;font-weight:600;}
  .clockbtn{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--inkSoft);font-size:13px;}
  .clockbtn.active{background:var(--mustardSoft);color:var(--mustard);}
  .daycard-body{padding:8px 12px 12px;}
  .empty-slot{width:100%;height:86px;border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--inkSoft);}
  .empty-slot span{font-size:12px;font-weight:500;}
  .slots{padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;}
  .slot-row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:10px;text-align:left;}
  .slot-row.filled{background:var(--bg);}
  .slot-row.empty{border:1px dashed var(--line);}
  .slot-dot{width:20px;height:20px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;}
  .slot-dot.outline{background:transparent;border:1.5px dashed;font-size:12px;font-weight:700;}
  .slot-text{flex:1;min-width:0;display:flex;flex-direction:column;}
  .slot-label-sm{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--inkSoft);}
  .slot-recipe{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .slot-warn{font-size:11px;flex-shrink:0;}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;}
  .meal-name{margin-top:6px;font-size:14px;font-weight:600;line-height:1.3;}
  .meal-meta{margin-top:4px;font-size:11.5px;color:var(--inkSoft);display:flex;align-items:center;gap:4px;}
  .conflict-note{margin-top:4px;font-size:11px;color:var(--berry);display:flex;align-items:center;gap:4px;}

  .hint{margin:16px 20px 4px;border-radius:16px;padding:14px;background:var(--sageSoft);display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;}
  .today-card{margin:14px 20px 0;border-radius:18px;background:#fff;border:1.5px solid var(--sage);overflow:hidden;}
  .today-card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
  .today-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--sage);padding:3px 8px;border-radius:999px;margin-bottom:4px;}
  .today-day-name{font-size:18px;font-weight:600;color:var(--ink);}
  .today-slots{display:flex;flex-direction:column;}
  .today-slot{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line);text-align:left;}
  .today-slot-recipe{font-size:14.5px;font-weight:600;color:var(--ink);}
  .today-slot-chevron{color:var(--inkSoft);font-size:18px;}
  .today-chip{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--sage);padding:2px 5px;border-radius:5px;vertical-align:middle;margin-left:4px;}
  .daycard.today{border-color:var(--sage);border-width:1.5px;}

  /* recipe grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 32px;}
  .rcard{text-align:left;border-radius:16px;background:#fff;border:1px solid var(--line);overflow:hidden;position:relative;width:100%;cursor:pointer;}
  .rcard-fav-row{position:absolute;top:14px;right:10px;z-index:2;display:flex;gap:5px;}
  .icon-btn{width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--inkSoft);}
  .icon-btn.fav-active{background:var(--mustardSoft);color:var(--mustard);}
  .icon-btn.dis-active{background:var(--berrySoft);color:var(--berry);}
  .rcard-strip{height:8px;}
  .rcard-hole{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:12px;height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);}
  .rcard-body{padding:14px;}
  .rcard-body.compact{padding:12px;}
  .rcard-badges{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .rcard-name{font-size:17px;font-weight:600;line-height:1.3;}
  .rcard-body.compact .rcard-name{font-size:15px;}
  .rcard-meta{margin-top:6px;font-size:12px;color:var(--inkSoft);display:flex;align-items:center;gap:4px;}

  /* sheet */
  #sheetRoot{position:fixed;inset:0;z-index:50;display:none;}
  #sheetRoot.open{display:block;}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);}
  .sheet-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;}
  .sheet{background:#fff;border-radius:24px 24px 0 0;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:slideup .22s ease-out;}
  @keyframes slideup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;border-bottom:1px solid var(--line);}
  .sheet-title{font-size:19px;font-weight:600;}
  .sheet-close{width:32px;height:32px;border-radius:999px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .sheet-body{overflow-y:auto;padding:16px 20px 28px;}
  .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--inkSoft);margin-bottom:6px;display:block;}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink);margin-bottom:16px;outline:none;background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn-primary{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;color:#fff;background:var(--ink);}
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 8px 6px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--berrySoft);color:var(--berry);}
  .chip button{padding:2px;border-radius:999px;display:flex;}
  .ing-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
  .ing-row input.ing-name{flex:2;min-width:0;}
  .ing-row input.ing-qty{width:52px;}
  .ing-row input.ing-unit{width:60px;}
  .ing-row select.ing-cat{width:96px;font-size:11.5px;}
  .ing-row input,.ing-row select{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--ink);}
  .ing-remove{padding:6px;color:var(--inkSoft);flex-shrink:0;}
  .warn-box{margin-bottom:16px;border-radius:12px;padding:12px;background:var(--berrySoft);}
  .warn-title{font-size:12px;font-weight:600;color:var(--berry);display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .warn-line{font-size:12.5px;color:var(--berry);}
  .ing-list{list-style:none;padding:0;margin:0 0 20px;}
  .ing-list li{display:flex;justify-content:space-baseline;justify-content:space-between;font-size:14.5px;padding:5px 0;}
  .ing-list .qty{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--inkSoft);}
  .method-list{list-style:none;counter-reset:step;padding:0;margin:0 0 20px;}
  .method-list li{counter-increment:step;position:relative;padding:4px 0 4px 34px;font-size:14.5px;line-height:1.5;color:var(--ink);margin-bottom:6px;}
  .method-list li::before{content:counter(step);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:999px;background:var(--sageSoft);color:var(--sage);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* shopping */
  .shop-empty{margin:0 20px;border-radius:16px;padding:28px 20px;text-align:center;background:#fff;border:1px solid var(--line);color:var(--inkSoft);font-size:14px;}
  .shop-group{margin:0 20px 20px;}
  .shop-cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--sage);margin-bottom:8px;}
  .shop-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;}
  .shop-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);text-align:left;}
  .shop-item:first-child{border-top:none;}
  .checkbox{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .checkbox.checked{background:var(--sage);border-color:var(--sage);}
  .shop-item-name{flex:1;font-size:14.5px;}
  .shop-item-name.checked{color:var(--inkSoft);text-decoration:line-through;}
  .shop-item-qty{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--inkSoft);}

  /* family */
  .member-card{margin:0 20px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);padding:16px;}
  .member-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .member-id{display:flex;align-items:center;gap:10px;}
  .avatar{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;font-family:'Fraunces',serif;}
  .member-name{font-size:15.5px;font-weight:600;}
  .dislikes-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;}
  .add-dislike-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:6px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--inkSoft);}
  .dropdown{position:absolute;z-index:5;top:34px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:8px;width:220px;}
  .dropdown-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);margin-bottom:6px;outline:none;}
  .dropdown-list{max-height:220px;overflow-y:auto;}
  .dropdown button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;}
  .dropdown button:hover{background:#F5F5F0;}
  .add-member-box{margin:0 20px 32px;border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:8px;}
  .add-member-box input{flex:1;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--ink);}
  .round-btn{width:36px;height:36px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}

  /* nav */
  #navRoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
  .navrow{display:flex;justify-content:space-between;}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;}
  .navbtn .navicon{font-size:19px;}
  .navbtn .navlabel{font-size:10.5px;font-weight:500;color:var(--inkSoft);}
  .navbtn.active .navlabel{color:var(--sage);}

  .fab{width:40px;height:40px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .top-row{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px;}
</style>
</head>
<body>
<div id="shell">
  <div id="view"></div>
  <div id="navRoot"></div>
</div>
<div id="sheetRoot"></div>

<script>
/* ---------------------------------- palette / constants ---------------------------------- */
const COLOR = { sage:'var(--sage)', sageSoft:'var(--sageSoft)', mustard:'var(--mustard)', mustardSoft:'var(--mustardSoft)', berry:'var(--berry)', berrySoft:'var(--berrySoft)', teal:'var(--teal)', tealSoft:'var(--tealSoft)', ink:'var(--ink)' };
const CATEGORY_STYLE = {
  Breakfast: { c: COLOR.mustard, bg: COLOR.mustardSoft },
  Lunch: { c: COLOR.sage, bg: COLOR.sageSoft },
  Dinner: { c: COLOR.berry, bg: COLOR.berrySoft },
  Snack: { c: COLOR.teal, bg: COLOR.tealSoft },
};
const DISLIKE_TAGS = [
  "Mushrooms","Seafood","Fish","Shellfish","Spicy","Coriander","Olives","Onions","Garlic",
  "Extra Cheesy","Dairy","Egg","Red Meat","Beef","Pork","Bacon","Chicken","Tofu",
  "Beans","Lentils","Peas","Broccoli","Cauliflower","Spinach","Capsicum","Tomatoes",
  "Cucumber","Avocado","Bananas","Nuts","Peanuts","Coconut","Curry","Raisins"
];
const ING_CATEGORIES = ["Produce","Meat & Seafood","Dairy & Eggs","Bakery & Grains","Pantry","Other"];
const MEMBER_COLORS = [COLOR.sage, COLOR.mustard, COLOR.berry, COLOR.teal, "#6D6A9C", "#B5652F"];
let _id = 1000;
const nid = () => String(_id++);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------------------------------- seed data ---------------------------------- */
const TAG_STYLE = {

  "Kid-Friendly": { c:"#B5652F", bg:"#FBE9DA", icon:"🧒" },
  "Slow Cooker": { c:"#8A5A2B", bg:"#F1E4D3", icon:"🥘" },

function R(name, category, prepTime, flags, tags, rows){
  return { id: nid(), name, category, prepTime, flags, tags,
    ingredients: rows.map(([n,qty,unit,cat]) => ({ name:n, qty, unit, category:cat })) };
}
function seedRecipes(){ return [
  /* ---------- Breakfast (25) ---------- */
  R("Veggie Scramble Toast","Breakfast",15,["Egg"],["Healthy"],[["Eggs",6,"","Dairy & Eggs"],["Sourdough bread",4,"slices","Bakery & Grains"],["Baby spinach",1,"cup","Produce"],["Cherry tomatoes",1,"cup","Produce"],["Cheddar cheese",50,"g","Dairy & Eggs"],["Butter",1,"tbsp","Dairy & Eggs"]]),
  R("Overnight Oats","Breakfast",10,[],["Healthy"],[["Rolled oats",2,"cup","Pantry"],["Milk",2,"cup","Dairy & Eggs"],["Chia seeds",2,"tbsp","Pantry"],["Banana",2,"","Produce"],["Honey",2,"tbsp","Pantry"],["Blueberries",1,"cup","Produce"]]),
  R("Weekend Pancakes","Breakfast",20,["Egg"],["Kid-Friendly"],[["Flour",2,"cup","Pantry"],["Eggs",2,"","Dairy & Eggs"],["Milk",1.5,"cup","Dairy & Eggs"],["Butter",2,"tbsp","Dairy & Eggs"],["Maple syrup",0.5,"cup","Pantry"],["Blueberries",1,"cup","Produce"]]),
  R("Greek Yogurt Parfait","Breakfast",8,[],["Healthy","Kid-Friendly"],[["Greek yogurt",2,"cup","Dairy & Eggs"],["Granola",1,"cup","Pantry"],["Strawberries",1,"cup","Produce"],["Honey",2,"tbsp","Pantry"]]),
  R("Banana Oat Pancakes","Breakfast",20,["Egg"],["Healthy","Kid-Friendly"],[["Rolled oats",1.5,"cup","Pantry"],["Banana",3,"","Produce"],["Eggs",3,"","Dairy & Eggs"],["Cinnamon",1,"tsp","Pantry"],["Milk",0.5,"cup","Dairy & Eggs"]]),
  R("Avocado Toast","Breakfast",10,[],["Healthy"],[["Avocado",2,"","Produce"],["Sourdough bread",4,"slices","Bakery & Grains"],["Cherry tomatoes",1,"cup","Produce"],["Lemon",1,"","Produce"],["Chilli flakes",1,"tsp","Pantry"]]),
  R("Breakfast Burrito","Breakfast",20,["Egg","Spicy"],[],[["Eggs",6,"","Dairy & Eggs"],["Tortilla wraps",4,"","Bakery & Grains"],["Black beans",1,"tin","Pantry"],["Cheddar cheese",80,"g","Dairy & Eggs"],["Salsa",0.5,"cup","Pantry"]]),
  R("French Toast Sticks","Breakfast",15,["Egg"],["Kid-Friendly"],[["Bread",6,"slices","Bakery & Grains"],["Eggs",3,"","Dairy & Eggs"],["Milk",0.5,"cup","Dairy & Eggs"],["Cinnamon",1,"tsp","Pantry"],["Maple syrup",0.5,"cup","Pantry"]]),
  R("Smoothie Bowl","Breakfast",10,[],["Healthy"],[["Frozen berries",2,"cup","Produce"],["Banana",1,"","Produce"],["Greek yogurt",1,"cup","Dairy & Eggs"],["Granola",0.5,"cup","Pantry"],["Chia seeds",1,"tbsp","Pantry"]]),
  R("Veggie Frittata","Breakfast",30,["Egg"],["Healthy"],[["Eggs",8,"","Dairy & Eggs"],["Zucchini",1,"","Produce"],["Capsicum",1,"","Produce"],["Feta cheese",60,"g","Dairy & Eggs"],["Onion",1,"","Produce"]]),
  R("PB Banana Toast","Breakfast",8,[],["Kid-Friendly","Healthy"],[["Wholegrain bread",4,"slices","Bakery & Grains"],["Peanut butter",4,"tbsp","Pantry"],["Banana",2,"","Produce"]]),
  R("Breakfast Quesadilla","Breakfast",15,["Egg","Extra Cheesy"],["Kid-Friendly"],[["Eggs",4,"","Dairy & Eggs"],["Tortilla wraps",4,"","Bakery & Grains"],["Cheddar cheese",100,"g","Dairy & Eggs"],["Ham",100,"g","Meat & Seafood"]]),
  R("Chia Pudding","Breakfast",5,[],["Healthy"],[["Chia seeds",0.5,"cup","Pantry"],["Milk",2,"cup","Dairy & Eggs"],["Vanilla extract",1,"tsp","Pantry"],["Mixed berries",1,"cup","Produce"]]),
  R("Blueberry Muffins","Breakfast",30,["Egg"],["Kid-Friendly"],[["Flour",2,"cup","Pantry"],["Eggs",2,"","Dairy & Eggs"],["Butter",0.5,"cup","Dairy & Eggs"],["Sugar",0.75,"cup","Pantry"],["Blueberries",1.5,"cup","Produce"]]),
  R("Shakshuka","Breakfast",25,["Egg","Spicy"],["Healthy"],[["Eggs",6,"","Dairy & Eggs"],["Tomato passata",500,"ml","Pantry"],["Capsicum",1,"","Produce"],["Onion",1,"","Produce"],["Cumin",1,"tsp","Pantry"]]),
  R("Granola & Milk","Breakfast",5,[],["Kid-Friendly"],[["Granola",3,"cup","Pantry"],["Milk",2,"cup","Dairy & Eggs"],["Banana",2,"","Produce"]]),

const STORAGE_KEY = "familyFoodPlannerState_v1";
function loadSavedState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      recipes: state.recipes,
      members: state.members,
      week: state.week,
      favouriteIds: state.favouriteIds,
      dislikedIds: state.dislikedIds,
      shoppingChecked: state.shoppingChecked,
    }));
  }catch(e){ /* storage unavailable — app still works, just won't persist */ }
}
function bumpIdCounter(arr){
  (arr || []).forEach(o => {
    const n = parseInt(o.id, 10);
    if(!isNaN(n) && n >= _id) _id = n + 1;
  });
}

/* ---------------------------------- helpers ---------------------------------- */
function conflictsFor(recipe, members){
  const hits = [];
  members.forEach(m => {
    const overlap = m.dislikes.filter(d => recipe.flags.includes(d));
    if(overlap.length) hits.push({ member:m, tags:overlap });
  });
  return hits;
}
function pickRecipeForSlot(day, slotName){
  const safe = state.recipes.filter(r => r.category === slotName && !isDisliked(r.id) && conflictsFor(r, state.members).length === 0);
  if(safe.length === 0) return null;
  const timeFiltered = day.quickRequired ? (safe.filter(r => r.prepTime <= 30).length ? safe.filter(r => r.prepTime <= 30) : safe) : safe;
  const favs = timeFiltered.filter(r => isFavourite(r.id));
  const pool = favs.length ? favs : timeFiltered;
  return pool[Math.floor(Math.random() * pool.length)];
}
function isFavourite(id){ return !!state.favouriteIds[id]; }
function isDisliked(id){ return !!state.dislikedIds[id]; }
function toggleFavourite(id){
  if(state.favouriteIds[id]) delete state.favouriteIds[id];
  else { state.favouriteIds[id] = true; delete state.dislikedIds[id]; }
}
function toggleDisliked(id){
  if(state.dislikedIds[id]){
    delete state.dislikedIds[id];
  } else {
    state.dislikedIds[id] = true;
    delete state.favouriteIds[id];
    state.week.forEach(d => { SLOT_ORDER.forEach(s => { if(d.meals[s] === id) d.meals[s] = null; }); });
  }
}
function fmtQty(qty){
  const r = Math.round(qty*100)/100;
  return Number.isInteger(r) ? String(r) : String(r);
}
function findRecipe(id){ return state.recipes.find(r => r.id === id); }
function findDay(key){ return state.week.find(d => d.key === key); }

/* Generates a sensible step-by-step method from a recipe's name + ingredients.
   Works for the built-in recipe box AND anything the user adds themselves. */
function generateSteps(r){
  const name = r.name.toLowerCase();
  const ing = r.ingredients || [];
  const protein = ing.find(i => i.category === "Meat & Seafood");
  const vegList = ing.filter(i => i.category === "Produce").map(i => i.name.toLowerCase());
  const mainVeg = vegList[0];

  if((r.tags||[]).includes("Slow Cooker")){
    const steps = [];
    steps.push(protein ? `Add the ${protein.name.toLowerCase()} to the slow cooker along with the vegetables and seasonings.` : "Add all the ingredients to the slow cooker.");
    steps.push("Pour in the stock or liquid ingredients, give everything a stir, then pop the lid on.");
    steps.push("Cook on low for 6–8 hours, or on high for 3–4 hours, until everything's tender.");
    steps.push("Stir through (shredding the meat if needed), taste, adjust the seasoning, and serve.");
    return steps;
  }

  const isNoCook = /sandwich|wrap|salad|toast|toastie|smoothie|parfait|\bdip\b|bark|popsicle|overnight oats|chia pudding|trail mix|nachos|hummus cups|dried |frozen grapes|mixed nuts|cheese (stick|ball|crisps)|bagel|panini/.test(name) && !/grilled|baked|roast/.test(name);
  const isSoup = /soup|stew|chowder|ragu|bourguignon/.test(name);
  const isCurry = /curry|curried|tikka masala|jambalaya|chilli/.test(name);
  const isPasta = /pasta|spaghetti|penne|fettuccine|lasagna|gnocchi|ziti|noodle|mac and cheese|tetrazzini|carbonara/.test(name);
  const isRice = /rice bowl|fried rice|risotto|paella|congee|bibimbap|poke bowl|rice \&/.test(name);
  const isOven = /bake|baked|roast|casserole|\bpie\b|enchilada|schnitzel|meatloaf|wellington|moussaka|parmesan|stuffed|muffin|cookie|bread|scone|biscuit|quiche|\bslice\b/.test(name);

  const steps = [];
  if(isNoCook){
    steps.push("Prep everything first — wash and chop any fresh ingredients, and measure out the rest.");
    if(protein) steps.push(`If using ${protein.name.toLowerCase()}, cook it first and let it cool slightly.`);
    steps.push("Layer, toss or blend everything together.");
    steps.push("Serve straight away, or chill until you're ready to eat.");
  } else if(isSoup || isCurry){
    steps.push("Heat a splash of oil in a large pot over medium heat.");
    if(mainVeg) steps.push(`Add the onion and any other veg like ${mainVeg}, and cook for a few minutes until softened.`);
    if(protein) steps.push(`Add the ${protein.name.toLowerCase()} and cook until browned all over.`);
    steps.push(`Pour in the remaining liquid ingredients, bring to a simmer, and cook for around ${Math.max(r.prepTime - 10, 15)}–${r.prepTime} minutes until everything's tender.`);
    steps.push("Season to taste and serve hot.");
  } else if(isPasta){
    steps.push("Bring a large pot of salted water to the boil and cook the pasta according to the packet instructions.");
    if(protein) steps.push(`Meanwhile, cook the ${protein.name.toLowerCase()} in a large pan until done.`);
    steps.push("Add the remaining ingredients to the pan and stir through to combine.");
    steps.push("Drain the pasta, toss it through the sauce, and serve hot.");
  } else if(isRice){
    steps.push("Cook the rice according to the packet instructions and set aside.");
    if(protein) steps.push(`Meanwhile, cook the ${protein.name.toLowerCase()} in a hot pan or wok until done.`);
    if(mainVeg) steps.push(`Add the ${mainVeg} and any other veg, and stir-fry for a few minutes until just tender.`);
    steps.push("Combine everything with the rice and serve hot.");
  } else if(isOven){
    steps.push("Preheat the oven to 180°C (350°F).");
    steps.push("Prepare and season all the ingredients, then arrange them in a baking dish or tray.");
    steps.push(`Bake for roughly ${Math.max(r.prepTime - 10, 10)}–${r.prepTime} minutes, until cooked through.`);
    steps.push("Rest for a few minutes before serving.");
  } else {
    steps.push("Prep all the ingredients — wash, chop and measure everything out.");
    if(protein) steps.push(`Cook the ${protein.name.toLowerCase()} in a pan over medium-high heat until done.`);
    if(mainVeg) steps.push(`Add the ${mainVeg} and any remaining veg, and cook until tender.`);
    steps.push("Stir through the rest of the ingredients and warm everything together.");
    steps.push("Season to taste and serve.");
  }
  return steps;
}

    : `<span class="badge" style="color:${COLOR.teal};background:${COLOR.tealSoft}">🍲 Standard</span>`;
  const searchBlob = esc((r.name + " " + r.ingredients.map(i => i.name).join(" ")).toLowerCase());
  const fav = isFavourite(r.id), dis = isDisliked(r.id);
  return `

  const total = state.week.length * SLOT_ORDER.length;
  state.week.forEach(d => SLOT_ORDER.forEach(s => {

/* ---------------------------------- render: shopping tab ---------------------------------- */
function buildShoppingList(){
  const map = new Map();
  let mealCount = 0;
  state.week.forEach(d => {
    SLOT_ORDER.forEach(slot => {
      const recipeId = d.meals[slot];
      const recipe = recipeId ? findRecipe(recipeId) : null;
      if(!recipe) return;
      mealCount++;
      recipe.ingredients.forEach(ing => {
        const key = ing.name.toLowerCase() + "|" + ing.unit.toLowerCase();
        if(map.has(key)) map.get(key).qty += ing.qty;
        else map.set(key, { ...ing });
      });
    });
  });
  const grouped = {};
  ING_CATEGORIES.forEach(c => grouped[c] = []);
  Array.from(map.entries()).forEach(([key, ing]) => {
    const cat = grouped[ing.category] ? ing.category : "Other";
    grouped[cat].push({ key, ...ing });
  });
  Object.values(grouped).forEach(arr => arr.sort((a,b)=>a.name.localeCompare(b.name)));
  return { grouped, mealCount, total: map.size };
}
function renderShopping(){
  const { grouped, mealCount, total } = buildShoppingList();
  return `
    <div class="top-row" style="padding-bottom:4px;">
      <div>
        <h1 class="page-title serif">Shopping list</h1>
        <p class="page-sub">${total===0 ? "Nothing planned yet" : `${total} items from ${mealCount} planned meal${mealCount===1?'':'s'}`}</p>
      </div>
    </div>
    ${total===0 ? `
      <div class="shop-empty">🛒<br/><br/>Plan some meals in the Week tab and your list will build itself here.</div>
    ` : ING_CATEGORIES.filter(c => grouped[c].length).map(cat => `
      <div class="shop-group">
        <div class="shop-cat">${cat}</div>
        <div class="shop-list">
          ${grouped[cat].map(ing => `
            <button class="shop-item" data-action="shopping-toggle-item" data-key="${esc(ing.key)}">
              <span class="checkbox ${state.shoppingChecked[ing.key]?'checked':''}">${state.shoppingChecked[ing.key]?'✓':''}</span>
              <span class="shop-item-name ${state.shoppingChecked[ing.key]?'checked':''}">${esc(ing.name)}</span>
              <span class="shop-item-qty">${fmtQty(ing.qty)} ${esc(ing.unit)}</span>
            </button>`).join("")}
        </div>
      </div>`).join("")}`;
}

            <div class="ing-row">
              <input class="ing-name" placeholder="Ingredient" value="${esc(row.name)}" />
              <input class="ing-qty" placeholder="Qty" inputmode="decimal" value="${esc(row.qty)}" />
              <input class="ing-unit" placeholder="unit" value="${esc(row.unit)}" />
              <select class="ing-cat">
                ${ING_CATEGORIES.map(c => `<option ${row.category===c?'selected':''}>${c}</option>`).join("")}
              </select>
              <button class="ing-remove" data-action="add-recipe-remove-row" data-index="${i}">✕</button>
            </div>`).join("")}
        </div>
        <button class="btn-ghost" style="color:${COLOR.sage};margin-bottom:24px;" data-action="add-recipe-add-row">＋ Add ingredient</button>
        <button class="btn-primary" data-action="add-recipe-save" ${sheet.name.trim() ? "" : "disabled"}>Save recipe</button>
      </div>
    </div>`;
}

/* ---------------------------------- master render ---------------------------------- */
function render(){
  document.getElementById("view").innerHTML =
    state.tab==="week" ? renderWeek() :
    state.tab==="recipes" ? renderRecipes() :
    state.tab==="shopping" ? renderShopping() : renderFamily();
  document.getElementById("navRoot").innerHTML = renderNav();
  const sheetRoot = document.getElementById("sheetRoot");
  if(state.sheet){ sheetRoot.classList.add("open"); sheetRoot.innerHTML = renderSheet(); }
  else { sheetRoot.classList.remove("open"); sheetRoot.innerHTML = ""; }
  saveState();
}
function renderSheetOnly(){
  const sheetRoot = document.getElementById("sheetRoot");
  if(state.sheet){ sheetRoot.classList.add("open"); sheetRoot.innerHTML = renderSheet(); }
  else { sheetRoot.classList.remove("open"); sheetRoot.innerHTML = ""; }
}

/* ---------------------------------- sync helpers (preserve typed text before re-render) ---------------------------------- */
function syncAddRecipeForm(){
  if(!state.sheet || state.sheet.type !== "add-recipe") return;
  const nameEl = document.getElementById("recipeNameInput");
  const catEl = document.getElementById("recipeCategorySelect");
  const prepEl = document.getElementById("recipePrepInput");
  if(nameEl) state.sheet.name = nameEl.value;
  if(catEl) state.sheet.category = catEl.value;
  if(prepEl) state.sheet.prepTime = prepEl.value;
  const rowsEls = document.querySelectorAll("#ingredientRows .ing-row");
  const rows = [];
  rowsEls.forEach(rowEl => {
    rows.push({
      name: rowEl.querySelector(".ing-name").value,
      qty: rowEl.querySelector(".ing-qty").value,
      unit: rowEl.querySelector(".ing-unit").value,
      category: rowEl.querySelector(".ing-cat").value,
    });
  });
  if(rows.length) state.sheet.rows = rows;
}
function syncFamilyForm(){
  const el = document.getElementById("newMemberInput");
  if(el) state.newMemberName = el.value;
}

/* ---------------------------------- event delegation ---------------------------------- */
document.body.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("sheet-backdrop")){
    state.sheet = null; renderSheetOnly(); return;
  }
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case "set-tab":
      state.familyDropdownOpenId = null;
      state.tab = el.dataset.tab;
      render();
      break;

    case "open-picker": {
      const day = findDay(el.dataset.day);
      const slot = el.dataset.slot;
      state.sheet = { type:"picker", dayKey: day.key, slot, timeFilter: day.quickRequired ? "quick" : "all", hideConflicts: true };
      renderSheetOnly();
      break;
    }
    case "toggle-day-quick": {
      const d = findDay(el.dataset.day);
      d.quickRequired = !d.quickRequired;
      render();
      break;
    }
    case "autofill-day": {
      const d = findDay(el.dataset.day);
      SLOT_ORDER.forEach(slot => {
        if(!d.meals[slot]){
          const pick = pickRecipeForSlot(d, slot);
          if(pick) d.meals[slot] = pick.id;
        }
      });
      render();
      break;
    }
    case "autofill-week": {
      state.week.forEach(d => {
        SLOT_ORDER.forEach(slot => {
          if(!d.meals[slot]){
            const pick = pickRecipeForSlot(d, slot);
            if(pick) d.meals[slot] = pick.id;
          }
        });
      });
      render();
      break;
    }
    case "clear-week": {
      state.sheet = { type: "confirm-clear" };
      renderSheetOnly();
      break;
    }
    case "confirm-clear-yes": {
      state.week.forEach(d => { SLOT_ORDER.forEach(slot => { d.meals[slot] = null; }); });
      state.sheet = null;
      render();
      break;
    }
    case "close-sheet":
      state.sheet = null;
      renderSheetOnly();
      break;

    case "picker-set-time":
      state.sheet.timeFilter = el.dataset.value;
      renderSheetOnly();
      break;
    case "picker-toggle-hide":
      state.sheet.hideConflicts = !state.sheet.hideConflicts;
      renderSheetOnly();
      break;
    case "picker-pick-recipe": {
      const day = findDay(state.sheet.dayKey);
      day.meals[state.sheet.slot] = el.dataset.id;
      state.sheet = null;
      render();
      break;
    }
    case "picker-clear-meal": {
      const day = findDay(state.sheet.dayKey);
      day.meals[state.sheet.slot] = null;
      state.sheet = null;
      render();
      break;
    }

    case "open-recipe-detail":
      state.sheet = { type:"detail", recipeId: el.dataset.id };
      renderSheetOnly();
      break;
    case "delete-recipe": {
      const id = el.dataset.id;
      state.recipes = state.recipes.filter(r => r.id !== id);
      state.week.forEach(d => { SLOT_ORDER.forEach(s => { if(d.meals[s] === id) d.meals[s] = null; }); });
      delete state.favouriteIds[id];
      delete state.dislikedIds[id];
      state.sheet = null;
      render();
      break;
    }

    case "open-add-recipe":
      state.sheet = { type:"add-recipe", name:"", category:"Dinner", prepTime:30, flags:[], tags:[], rows:[{name:"",qty:"",unit:"",category:"Produce"}] };
      renderSheetOnly();
      break;
    case "add-recipe-toggle-flag":
      syncAddRecipeForm();
      { const t = el.dataset.value;
        state.sheet.flags = state.sheet.flags.includes(t) ? state.sheet.flags.filter(x=>x!==t) : [...state.sheet.flags, t]; }
      renderSheetOnly();
      break;
    case "add-recipe-toggle-tag":
      syncAddRecipeForm();
      { const t = el.dataset.value;
        state.sheet.tags = state.sheet.tags.includes(t) ? state.sheet.tags.filter(x=>x!==t) : [...state.sheet.tags, t]; }
      renderSheetOnly();
      break;
    case "add-recipe-add-row":
      syncAddRecipeForm();
      state.sheet.rows.push({name:"",qty:"",unit:"",category:"Produce"});
      renderSheetOnly();
      break;
    case "add-recipe-remove-row":
      syncAddRecipeForm();
      state.sheet.rows.splice(parseInt(el.dataset.index), 1);
      if(state.sheet.rows.length === 0) state.sheet.rows.push({name:"",qty:"",unit:"",category:"Produce"});
      renderSheetOnly();
      break;
    case "add-recipe-save": {
      syncAddRecipeForm();
      const s = state.sheet;
      if(!s.name.trim()) break;
      const ingredients = s.rows.filter(r => r.name.trim()).map(r => ({ name:r.name.trim(), qty: parseFloat(r.qty)||1, unit:(r.unit||"").trim(), category:r.category }));
      if(ingredients.length === 0) break;
      state.recipes.unshift({ id:nid(), name:s.name.trim(), category:s.category, prepTime: parseInt(s.prepTime)||0, flags:s.flags, tags:s.tags||[], ingredients });
      state.sheet = null;
      render();
      break;
    }

    case "recipes-set-cat":
      state.recipesFilter.cat = el.dataset.value;
      render();
      break;
    case "recipes-set-time":
      state.recipesFilter.time = el.dataset.value;
      render();
      break;
    case "recipes-set-diet":
      state.recipesFilter.diet = el.dataset.value;
      render();
      break;
    case "recipes-set-show":
      state.recipesFilter.show = el.dataset.value;
      render();
      break;
    case "toggle-favourite":
      toggleFavourite(el.dataset.id);
      render();
      break;
    case "toggle-dislike-recipe":
      toggleDisliked(el.dataset.id);
      render();
      break;

    case "shopping-toggle-item":
      state.shoppingChecked[el.dataset.key] = !state.shoppingChecked[el.dataset.key];
      render();
      break;

    case "family-remove-member":
      state.members = state.members.filter(m => m.id !== el.dataset.id);
      render();
      break;
    case "family-toggle-dropdown":
      syncFamilyForm();
      state.familyDropdownOpenId = state.familyDropdownOpenId === el.dataset.id ? null : el.dataset.id;
      render();
      break;
    case "family-add-dislike": {
      syncFamilyForm();
      const m = state.members.find(x => x.id === el.dataset.id);
      if(m && !m.dislikes.includes(el.dataset.tag)) m.dislikes.push(el.dataset.tag);
      state.familyDropdownOpenId = null;
      render();
      break;
    }
    case "family-remove-dislike": {
      syncFamilyForm();
      const m = state.members.find(x => x.id === el.dataset.id);
      if(m) m.dislikes = m.dislikes.filter(d => d !== el.dataset.tag);
      render();
      break;
    }
    case "family-add-member": {
      const nameEl = document.getElementById("newMemberInput");
      const name = nameEl ? nameEl.value.trim() : "";
      if(!name) break;
      const color = MEMBER_COLORS[state.members.length % MEMBER_COLORS.length];
      state.members.push({ id:nid(), name, color, dislikes:[] });
      state.newMemberName = "";
      render();
      break;
    }
  }
});

/* enter-to-add for new member field (delegated, since field is re-rendered) */
document.body.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && e.target && e.target.id === "newMemberInput"){
    document.querySelector('[data-action="family-add-member"]')?.click();
  }
});

/* live search filtering — filters DOM in place so the search input never loses focus */
document.body.addEventListener("input", (e) => {
  if(e.target.id === "dislikeSearchInput"){
    const q = e.target.value.trim().toLowerCase();
    let anyVisible = false;
    document.querySelectorAll(".dislike-option").forEach(btn => {
      const match = btn.dataset.search.includes(q);
      btn.style.display = match ? "" : "none";
      if(match) anyVisible = true;
    });
    const noMatch = document.querySelector(".dropdown-no-match");
    if(noMatch) noMatch.style.display = anyVisible ? "none" : "block";
  }
  if(e.target.id === "recipeSearchInput"){
    const q = e.target.value.trim().toLowerCase();
    let anyVisible = false;
    document.querySelectorAll(".grid2 .rcard").forEach(card => {
      const match = card.dataset.search.includes(q);
      card.style.display = match ? "" : "none";
      if(match) anyVisible = true;
    });
    const empty = document.getElementById("recipeSearchEmpty");
    if(empty) empty.style.display = anyVisible ? "none" : "block";
  }
});

render();

if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
